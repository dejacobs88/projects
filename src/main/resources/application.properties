# Plain CLI: no web server, no banner, quiet logs
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false
logging.level.root=WARN

# Embedded H2 file database (./sbom.mv.db). Override the path with the SBOM_DB env var.
spring.datasource.url=jdbc:h2:file:${SBOM_DB:./sbom}
# Hibernate creates/updates the schema from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
